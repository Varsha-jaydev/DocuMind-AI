<!DOCTYPE html>
<html>

<head>
    <head>
    <title>DocuMind AI</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>


    <style>
        body {
            font-family: Arial;
            max-width: 800px;
            margin: 40px auto;
            background: #f5f5f5;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 10px 25px;
            cursor: pointer;
        }

        #answer {
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
    </style>

</head>


<body>

<h1>🤖 Python AI Assistant</h1>

<textarea id="question"
placeholder="Ask a Python question..."></textarea>

<br>

<button onclick="askAI()">
    Ask
</button>


<div id="answer">
</div>


<script>

async function askAI(){

    const question =
        document.getElementById("question").value;


    document.getElementById("answer").innerHTML =
        "Thinking...";


    const response = await fetch(
        "http://127.0.0.1:8000/chat",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                question: question
            })
        }
    );


    const data = await response.json();


    document.getElementById("answer").innerHTML =
        marked.parse(data.answer);

}

</script>


</body>

</html>
